server:
  port: 8761 # Eureka Server 默认端口

spring:
  application:
    name: eureka-server

# Eureka Server 单机配置
# 单机模式下不需要向自己注册、也不需要从自己拉取注册表
eureka:
  client:
    register-with-eureka: false # 不把自己注册到注册中心
    fetch-registry: false       # 不拉取注册表
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost

# Actuator 端点配置
# health: 显示完整健康详情（含磁盘、ping、eureka 等）
# httpexchanges: 最近 100 次 HTTP 请求跟踪（Spring Boot 4 的 trace 端点）
# info: 应用信息；metrics: 指标；env: 环境变量；loggers: 日志级别
management:
  endpoints:
    web:
      exposure:
        include: health,info,httpexchanges,metrics,env,loggers
  endpoint:
    health:
      show-details: always
