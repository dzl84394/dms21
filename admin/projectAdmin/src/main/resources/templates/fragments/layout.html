<!DOCTYPE html>
<!--
  公共布局 fragment（Thymeleaf），projectAdmin 所有页面共用：
  样式与 serviceAdmin / archAdmin 一致；侧边栏为"项目与需求管理"5 个功能入口（首期为占位页）。

  用法：
    <head th:replace="~{fragments/layout :: head('项目立项', false)}"></head>
    <div th:replace="~{fragments/layout :: sidebar('projects')}"></div>
  active 取值：projects / releases / requirements / bugs / incidents / worklogs（对应侧边栏 6 个入口）
-->
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<head th:fragment="head(title, refresh)">
    <meta charset="UTF-8">
    <meta th:if="${refresh}" http-equiv="refresh" content="30">
    <title th:text="${title}">projectAdmin</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
               background: #f5f6fa; color: #2f3542; }
        .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 220px;
                   background: #2f3542; color: #c8ccd4; padding: 18px 0; overflow-y: auto; }
        .sidebar .brand { font-size: 16px; font-weight: 700; color: #fff;
                          padding: 0 20px 16px; border-bottom: 1px solid #414957; }
        .sidebar .main-nav { padding: 12px 0; border-bottom: 1px solid #414957; }
        .sidebar a { display: flex; justify-content: space-between; align-items: center;
                     padding: 9px 20px; color: #c8ccd4; text-decoration: none; font-size: 13px; }
        .sidebar a:hover { background: #3a4250; color: #fff; }
        .sidebar a.on { background: #3742fa; color: #fff; }
        .sidebar .tree-title { font-size: 12px; color: #808a99; padding: 14px 20px 6px; }
        .sidebar .count { background: #414957; color: #c8ccd4; border-radius: 9px;
                          padding: 1px 8px; font-size: 11px; }
        .sidebar a.on .count, .sidebar a:hover .count { background: rgba(255,255,255,.25); color: #fff; }
        .content { margin-left: 220px; padding: 24px 28px; min-width: 900px; }
        h1 { font-size: 20px; margin-bottom: 6px; }
        h2 { font-size: 15px; margin: 0 0 12px; }
        .desc { color: #747d8c; font-size: 13px; margin-bottom: 16px; }
        table { width: 100%; border-collapse: collapse; background: #fff; font-size: 13px;
                border-radius: 8px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
        th { background: #2f3542; color: #fff; text-align: left; padding: 9px 12px;
             font-weight: 500; white-space: nowrap; }
        td { padding: 8px 12px; border-top: 1px solid #f1f2f6; }
        tbody tr:hover td { background: #f1f2f6; }
        .card { background: #fff; border-radius: 10px; padding: 16px 20px;
                box-shadow: 0 1px 4px rgba(0,0,0,.06); margin-bottom: 18px; }
        input[type=text], textarea, select {
            padding: 5px 8px; border: 1px solid #ced6e0;
            border-radius: 6px; font-size: 13px; background: #fff; }
        textarea { width: 100%; font-size: 12.5px; line-height: 1.6; resize: vertical; }
        button { padding: 5px 14px; border: none; border-radius: 6px; cursor: pointer;
                 background: #2f3542; color: #fff; font-size: 12px; }
        button:hover { opacity: .85; }
        button.del { background: #ff6b81; }
        .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px;
                   font-size: 13px; flex-wrap: wrap; }
        .badge { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 12px; color: #fff; }
        .ok   { background: #2ed573; }
        .warn { background: #ffa502; }
        .bad  { background: #ff4757; }
        .gray { background: #a4b0be; }
        .muted { color: #a4b0be; }
        a { color: #3742fa; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .tip { background: #fffbe6; border-left: 4px solid #faad14; border-radius: 4px;
               padding: 10px 14px; font-size: 12.5px; color: #7a6500; margin-top: 12px; line-height: 1.7; }
    </style>
</head>

<!--
  左侧导航 fragment：标题"项目与需求管理"+ 6 个功能入口（占位页，后续逐个充实），CMDB 置顶
-->
<div class="sidebar" th:fragment="sidebar(active)">
    <div class="brand">projectAdmin</div>
    <nav class="main-nav">
        <div class="tree-title">项目与需求管理</div>
        <a th:href="@{/admin/projects}" th:classappend="${active == 'projects'} ? 'on'">
            <span>项目立项</span>
        </a>
        <a th:href="@{/admin/releases}" th:classappend="${active == 'releases'} ? 'on'">
            <span>版本管理</span>
        </a>
        <a th:href="@{/admin/requirements}" th:classappend="${active == 'requirements'} ? 'on'">
            <span>需求管理</span>
        </a>
        <a th:href="@{/admin/bugs}" th:classappend="${active == 'bugs'} ? 'on'">
            <span>Bug 管理</span>
        </a>
        <a th:href="@{/admin/incidents}" th:classappend="${active == 'incidents'} ? 'on'">
            <span>故障管理</span>
        </a>
        <!-- 工时管理：真实页面（非占位），登记成员在项目/需求上的工时投入 -->
        <a th:href="@{/admin/worklogs}" th:classappend="${active == 'worklogs'} ? 'on'">
            <span>工时管理</span>
        </a>
    </nav>
    <!-- 返回主服务：跳回 serviceAdmin 首页（SSO 已打通，Cookie 全域生效免登录） -->
    <nav class="main-nav">
        <a href="http://localhost:8083/admin"><span>返回主服务</span><span class="count">8083</span></a>
    </nav>
    <!-- 退出登录：跳 serviceAdmin 统一登出，清除 DMS_TOKEN -->
    <nav class="main-nav">
        <a href="http://localhost:8083/logout"><span>退出登录</span></a>
    </nav>
</div>
</html>
