<!DOCTYPE html>
<!-- 版本管理列表页：状态徽标（当前/归档）+ 快照数 + 状态机操作（设当前/归档/删除） -->
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<head th:replace="~{fragments/layout :: head('版本管理 - apiAdmin', false)}"></head>
<body>
<div th:replace="~{fragments/layout :: sidebar('versions')}"></div>

<main class="content">
<h1>版本管理</h1>
<p class="desc">
    每个微服务同一时刻只有一个"当前版本"（可保存多份 Swagger 快照）；归档后自动去重只留最新一份。
    <a th:href="@{/admin/imports/form}" style="color:#3742fa;">+ 导入 Swagger</a>
</p>

<div class="tip" th:if="${not #strings.isEmpty(error)}" th:text="${error}">提示</div>

<!-- 过滤：服务下拉，选中即提交 -->
<form method="get" action="/admin/versions" class="toolbar">
    <select name="serviceId" onchange="this.form.submit();">
        <option value="">全部微服务</option>
        <option th:each="s : ${services}" th:value="${s.id}" th:text="${s.name + ' (' + s.code + ')'}"
                th:selected="${serviceId != null and serviceId == s.id}">订单服务</option>
    </select>
    <noscript><button type="submit">过滤</button></noscript>
    <a th:href="@{/admin/versions}" th:if="${serviceId != null}" style="color:#3742fa;">清除</a>
</form>

<table>
    <thead>
    <tr>
        <th>微服务</th>
        <th>版本号</th>
        <th>状态</th>
        <th>快照数</th>
        <th>最新导入</th>
        <th>操作</th>
    </tr>
    </thead>
    <tbody>
    <tr th:if="${#lists.isEmpty(items)}">
        <td colspan="6" class="muted">暂无版本。导入 Swagger 时填新版本号会自动创建版本。</td>
    </tr>
    <tr th:each="v : ${items}">
        <td>
            <b th:text="${serviceById[v.serviceId]?.code} ?: '未知服务'">service-a</b><br>
            <span class="muted" style="font-size:12px;"
                  th:text="${namespaceById[serviceById[v.serviceId]?.namespaceId]?.name} ?: ''">订单域</span>
        </td>
        <td><b th:text="${v.version}">v1.0.0</b></td>
        <td>
            <span class="badge" th:classappend="${v.current} ? 'ok' : 'gray'"
                  th:text="${v.current} ? '当前' : '归档'">当前</span>
        </td>
        <td th:text="${docStats[v.id] != null} ? ${docStats[v.id].count()} : 0">3</td>
        <td class="muted"
            th:text="${docStats[v.id] != null} ? ${#temporals.format(docStats[v.id].latestAt(), 'MM-dd HH:mm')} : '-'">10-11 15:30</td>
        <td>
            <a th:href="@{/admin/versions/detail(id=${v.id})}" style="color:#3742fa;">快照</a>
            <form th:unless="${v.current}" method="post"
                  th:action="@{'/admin/versions/setCurrent/' + ${v.id}}" style="display:inline;">
                <button type="submit">设当前</button>
            </form>
            <form th:if="${v.current}" method="post"
                  th:action="@{'/admin/versions/archive/' + ${v.id}}" style="display:inline;"
                  onsubmit="return confirm('归档后该版本只保留最新一份快照，其余删除，且不可再导入。确定归档？');">
                <button type="submit">归档</button>
            </form>
            <form th:unless="${v.current}" method="post"
                  th:action="@{'/admin/versions/delete/' + ${v.id}}" style="display:inline;"
                  onsubmit="return confirm('删除归档版本会连同其唯一快照一起删除。确定？');">
                <button type="submit" class="del">删除</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<div class="tip">
    规则：设为当前版本时，同服务原当前版本自动归档（快照去重只留最新一份）；当前版本不可删除，需先归档。
</div>
</main>

</body>
</html>
