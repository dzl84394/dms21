<!DOCTYPE html>
<!-- 微服务新增/编辑共用表单：svc 为空=新增模式（空间预选 ?namespaceId=），非空=编辑模式 -->
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<head th:replace="~{fragments/layout :: head(${svc == null} ? '新增微服务' : '编辑微服务', false)}"></head>
<body>
<div th:replace="~{fragments/layout :: sidebar('services')}"></div>

<main class="content">
<h1 th:text="${svc == null} ? '新增微服务' : '编辑微服务'">新增微服务</h1>
<p class="desc">服务编码全局唯一（建议与 Eureka 注册名一致），所属空间必选。</p>

<div class="tip" th:if="${not #strings.isEmpty(error)}" th:text="${error}">提示</div>

<div class="card" style="max-width:640px;">
    <form method="post" th:action="@{/admin/services/save}">
        <input type="hidden" name="id" th:value="${svc?.id}">
        <p>
            <label>所属空间 *</label><br>
            <select name="namespaceId" required style="width:280px;">
                <option value="">请选择空间</option>
                <option th:each="n : ${namespaces}" th:value="${n.id}"
                        th:text="${n.name + ' (' + n.code + ')'}"
                        th:selected="${svc != null ? svc.namespaceId == n.id
                                      : (namespaceId != null and namespaceId == n.id)}">订单域</option>
            </select>
        </p>
        <p>
            <label>服务编码 *</label><br>
            <input type="text" name="code" th:value="${svc?.code}" required maxlength="64"
                   placeholder="如 service-a" style="width:280px;">
        </p>
        <p>
            <label>服务名称 *</label><br>
            <input type="text" name="name" th:value="${svc?.name}" required maxlength="128"
                   placeholder="如 订单服务" style="width:280px;">
        </p>
        <p>
            <label>说明</label><br>
            <textarea name="description" rows="3" maxlength="500"
                      placeholder="服务定位说明（可空）"
                      th:text="${svc?.description}"></textarea>
        </p>
        <p>
            <button type="submit">保存</button>
            <a th:href="@{/admin/services}" style="margin-left:10px;color:#747d8c;">取消</a>
        </p>
    </form>
</div>
</main>

</body>
</html>
