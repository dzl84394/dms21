server:
  port: 8088 # baseAdmin 端口

spring:
  application:
    name: base-admin
  thymeleaf:
    cache: false # 开发期关缓存，改模板刷新即生效

# SSO 认证配置：secret 必须与 serviceAdmin 一致（验签同一把钥匙）
# 未登录访问 /admin/* 会 302 到 serviceAdmin 的统一登录页
auth:
  secret: dms21-sso-secret-2026
  cookie-name: DMS_TOKEN
  login-url: http://localhost:8083/login

# commonAdmin 页面地址：注册中心/配置中心/任务调度中心迁出后，旧路由 302 跳转用
commonadmin:
  url: http://localhost:8089

# 注册到 Eureka（baseDemo/eureka）
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    healthcheck:
      enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    metadata-map:
      bizGroup: platform # 归平台业务组
      subsystem: admin   # 与其他 admin 服务同属 admin 子系统

# Actuator 端点配置（与其他服务一致）
management:
  endpoints:
    web:
      exposure:
        include: health,info,httpexchanges,metrics,env,loggers
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c

# 日志格式：在每行日志前加 [服务名,traceId,spanId]
logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
