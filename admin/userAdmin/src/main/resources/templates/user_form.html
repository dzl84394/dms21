<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<!-- 公共 head（样式）+ 左侧导航，active=users 高亮 -->
<head th:replace="~{fragments/layout :: head('用户表单', false)}"></head>
<body>
<div th:replace="~{fragments/layout :: sidebar('users')}"></div>

<main class="content">
<!--
    新建/编辑共用的独立表单页（/admin/users/form）
    user == null → 新建模式：账号可填、密码必填、按钮"创建用户"
    user != null → 编辑模式：账号只读、密码留空不改、按钮"保存修改"
-->
<h1 th:text="${user != null} ? '编辑用户：' + ${user.username} : '新增用户'">新增用户</h1>
<p class="desc" th:if="${user != null}">
    登录账号创建后<b>不允许修改</b>；密码框留空 = 保留原密码。
</p>
<p class="desc" th:if="${user == null}">
    登录账号全局唯一；系统角色<b>按子系统分别授权</b>——在哪个子系统勾了角色，才能在那个子系统操作。
</p>

<div class="card">
    <form method="post" th:action="@{/admin/users/save}">
        <input type="hidden" name="id" th:value="${user?.id}">
        <table style="max-width:560px;">
            <tr>
                <td style="width:110px;">登录账号 <span th:if="${user == null}" style="color:#ff6b81;">*</span></td>
                <td>
                    <input type="text" name="username" required th:value="${user?.username}"
                           th:readonly="${user != null}" placeholder="如 zhangsan" style="width:100%;">
                </td>
            </tr>
            <tr>
                <td>
                    密码 <span th:if="${user == null}" style="color:#ff6b81;">*</span>
                    <div class="muted" style="font-size:11px;" th:if="${user != null}">留空=不修改</div>
                </td>
                <td>
                    <input type="password" name="password" th:required="${user == null}"
                           th:placeholder="${user != null} ? '留空表示不修改原密码' : '至少 6 位'"
                           style="width:100%;">
                </td>
            </tr>
            <tr>
                <td>姓名</td>
                <td><input type="text" name="realName" th:value="${user?.realName}"
                           placeholder="如 张三" style="width:100%;"></td>
            </tr>
            <tr>
                <td>所属公司</td>
                <td>
                    <!-- 多租户隔离字段：datalist 可选已有公司，也可输入新公司名（保存后自动进选项清单） -->
                    <input type="text" name="tenant" list="tenantOptions" th:value="${preselectTenant}"
                           placeholder="如 默认公司 / 子公司A" style="width:100%;">
                    <datalist id="tenantOptions">
                        <option th:each="t : ${tenants}" th:value="${t}"></option>
                    </datalist>
                </td>
            </tr>
            <tr>
                <td>
                    系统角色
                    <div class="muted" style="font-size:11px;">按子系统授权</div>
                </td>
                <td>
                    <!-- 角色按子系统分组：同一个用户在不同子系统可授不同角色；
                         在某子系统一个都不勾 = 在该子系统无任何权限 -->
                    <div th:if="${#maps.isEmpty(roleGroups)}" class="muted">
                        还没有角色，先到「角色管理」创建
                    </div>
                    <div th:each="group : ${roleGroups}" style="margin-bottom:8px;">
                        <div class="muted" style="font-size:11px;margin-bottom:2px;"
                             th:text="'子系统：' + ${group.key}">子系统：admin</div>
                        <label class="chk" th:each="r : ${group.value}" style="display:block;margin-left:8px;">
                            <input type="checkbox" name="roleIds" th:value="${r.id}"
                                   th:checked="${selectedRoleIds.contains(r.id)}">
                            <span th:text="${r.roleName}">系统管理员</span>
                            <span class="muted" th:text="'（' + ${r.roleCode} + '）'">（admin）</span>
                            <span class="badge gray" style="font-size:10px;padding:0 6px;"
                                  th:if="${!r.isEnabled()}">停用</span>
                        </label>
                    </div>
                </td>
            </tr>
            <tr>
                <td>
                    部门（可多选）
                    <div class="muted" style="font-size:11px;">一人可挂多岗</div>
                </td>
                <td>
                    <!-- 部门 checkbox 多选：只列同公司（预填公司）的部门，树形缩进；保存时全量重建关系 -->
                    <div style="max-height:160px;overflow:auto;border:1px solid #e3e6eb;
                                border-radius:6px;padding:8px 10px;">
                        <div class="muted" th:if="${#lists.isEmpty(deptTree)}">
                            该公司下还没有部门，先到「部门管理」创建
                        </div>
                        <label class="chk" th:each="n : ${deptTree}"
                               th:style="'display:block;margin-left:' + ${n.depth * 20} + 'px;'">
                            <input type="checkbox" name="deptIds" th:value="${n.dept.id}"
                                   th:checked="${selectedDeptIds.contains(n.dept.id)}">
                            <span th:text="${n.dept.deptName}">研发部</span>
                            <span class="muted" th:text="'（' + ${n.dept.effectiveTenant()} + '）'"
                                  th:if="${n.dept.effectiveTenant() != preselectTenant}"></span>
                        </label>
                    </div>
                </td>
            </tr>
            <tr>
                <td>邮箱</td>
                <td><input type="text" name="email" th:value="${user?.email}"
                           placeholder="如 zhangsan@dms21.com" style="width:100%;"></td>
            </tr>
            <tr>
                <td>手机</td>
                <td><input type="text" name="phone" th:value="${user?.phone}"
                           placeholder="如 13800000000" style="width:100%;"></td>
            </tr>
            <tr>
                <td>状态</td>
                <td>
                    <label class="chk"><input type="checkbox" name="enabled"
                           th:checked="${user == null or user.isEnabled()}">启用（停用后不可登录）</label>
                </td>
            </tr>
        </table>
        <div class="toolbar" style="margin-top:14px;">
            <button type="submit" th:text="${user != null} ? '保存修改' : '创建用户'">创建用户</button>
            <!-- 取消：回列表（PRG，不提交任何数据） -->
            <a th:href="@{/admin/users}" style="color:#808a99;">取消返回列表</a>
        </div>
    </form>
</div>
</main>

</body>
</html>
