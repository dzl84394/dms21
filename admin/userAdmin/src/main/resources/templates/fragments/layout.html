<!DOCTYPE html>
<!--
  公共布局 fragment（Thymeleaf），userAdmin 所有页面共用：
  样式与 serviceAdmin 完全一致，侧边栏为 userAdmin 自己的功能入口

  用法一（<head> 整体替换，带公共样式；refresh=true 时页面自动刷新）：
    <head th:replace="~{fragments/layout :: head('用户管理', false)}"></head>

  用法二（左侧导航）：
    <div th:replace="~{fragments/layout :: sidebar('users')}"></div>
    active 参数用于高亮当前页：users / dept / roles / resources
-->
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<head th:fragment="head(title, refresh)">
    <meta charset="UTF-8">
    <!-- 当前没有需要自动刷新的页面，refresh 保留参数与 serviceAdmin 对齐 -->
    <meta th:if="${refresh}" http-equiv="refresh" content="30">
    <title th:text="${title}">userAdmin</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
               background: #f5f6fa; color: #2f3542; }
        /* ===== 左侧导航 ===== */
        .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 220px;
                   background: #2f3542; color: #c8ccd4; padding: 18px 0;
                   overflow-y: auto; }
        .sidebar .brand { font-size: 16px; font-weight: 700; color: #fff;
                          padding: 0 20px 16px; border-bottom: 1px solid #414957; }
        .sidebar .main-nav { padding: 12px 0; }
        .sidebar a { display: flex; justify-content: space-between; align-items: center;
                     padding: 9px 20px; color: #c8ccd4; text-decoration: none; font-size: 13px; }
        .sidebar a:hover { background: #3a4250; color: #fff; }
        .sidebar a.on { background: #3742fa; color: #fff; }
        /* 分组小标题（系统管理） */
        .sidebar .tree-title { font-size: 12px; color: #808a99; padding: 14px 20px 6px; }
        .sidebar a .count { background: #414957; color: #c8ccd4; border-radius: 9px;
                          padding: 1px 8px; font-size: 11px; }
        .sidebar a.on .count, .sidebar a:hover .count { background: rgba(255,255,255,.25); color: #fff; }
        /* ===== 内容区 ===== */
        .content { margin-left: 220px; padding: 24px 28px; min-width: 900px; }
        h1 { font-size: 20px; margin-bottom: 6px; }
        .desc { color: #747d8c; font-size: 13px; margin-bottom: 16px; }
        /* ===== 表格/卡片 ===== */
        table { width: 100%; border-collapse: collapse; background: #fff; font-size: 13px;
                border-radius: 8px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
        th { background: #2f3542; color: #fff; text-align: left;
             padding: 9px 12px; font-weight: 500; white-space: nowrap; }
        td { padding: 8px 12px; border-top: 1px solid #f1f2f6; }
        tbody tr:hover td { background: #f1f2f6; }
        .card { background: #fff; border-radius: 10px; padding: 16px 20px;
                box-shadow: 0 1px 4px rgba(0,0,0,.06); margin-bottom: 18px; }
        .card h2 { font-size: 15px; margin: 0 0 12px; }
        /* ===== 表单控件 ===== */
        input[type=text], input[type=password], input[type=email], select {
            padding: 5px 8px; border: 1px solid #ced6e0;
            border-radius: 6px; font-size: 13px; background: #fff; }
        button { padding: 5px 14px; border: none; border-radius: 6px; cursor: pointer;
                 background: #2f3542; color: #fff; font-size: 12px; }
        button:hover { opacity: .85; }
        button.del { background: #ff6b81; }
        button:disabled { background: #a4b0be; cursor: not-allowed; }
        .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px;
                   font-size: 13px; flex-wrap: wrap; }
        /* ===== 徽章/辅助 ===== */
        .badge { display: inline-block; padding: 2px 10px; border-radius: 10px;
                 font-size: 12px; color: #fff; }
        .ok   { background: #2ed573; }   /* 启用 */
        .gray { background: #a4b0be; }   /* 停用 */
        .muted { color: #a4b0be; }
        .chk { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
        .chk input { accent-color: #3742fa; cursor: pointer; width: 15px; height: 15px; }
        /* 列表中被编辑的行高亮（与上方共享编辑表单呼应） */
        tr.editing-row { background: #3742fa14; outline: 1px solid #3742fa44; }
        .inline-form { display: inline-flex; gap: 6px; align-items: center; }
    </style>
</head>

<!--
  左侧导航 fragment：userAdmin 的功能入口
  新增功能页面时在 main-nav 里加 <a>，并同步更新上方的 active 取值注释
-->
<div class="sidebar" th:fragment="sidebar(active)">
    <div class="brand">userAdmin</div>
    <nav class="main-nav">
        <div class="tree-title">系统管理</div>
        <a th:href="@{/admin/users}" th:classappend="${active == 'users'} ? 'on'">
            <span>用户管理</span>
        </a>
        <a th:href="@{/admin/depts}" th:classappend="${active == 'dept'} ? 'on'">
            <span>部门管理</span>
        </a>
        <a th:href="@{/admin/roles}" th:classappend="${active == 'roles'} ? 'on'">
            <span>角色管理</span>
        </a>
        <a th:href="@{/admin/resources}" th:classappend="${active == 'resources'} ? 'on'">
            <span>资源管理</span>
        </a>
    </nav>
    <!-- 返回主服务：跳回 serviceAdmin 首页（SSO 已打通，Cookie 全域生效免登录） -->
    <nav class="main-nav">
        <a href="http://localhost:8083/admin"><span>返回主服务</span><span class="count">8083</span></a>
    </nav>
    <!-- 退出登录：跳 serviceAdmin 统一登出，清除 DMS_TOKEN（localhost 全域生效） -->
    <nav class="main-nav">
        <a href="http://localhost:8083/logout"><span>退出登录</span></a>
    </nav>
</div>
</html>
