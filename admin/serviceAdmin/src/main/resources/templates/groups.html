<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<!-- 公共 head（样式）+ 左侧导航，active=groups 高亮 -->
<head th:replace="~{fragments/layout :: head('业务领域管理', false)}"></head>
<body>
<div th:replace="~{fragments/layout :: sidebar('groups')}"></div>

<main class="content">
<h1>业务领域管理</h1>
<p class="desc">
    业务领域字典：组编码 + 中文说明 + 三类负责人。服务分配业务领域在"微服务管理"页的行内下拉里选；
    左侧导航树"按业务领域浏览"的节点和这里的字典对应。
</p>

<div class="card">
    <h2>业务领域维护</h2>
    <form method="post" th:action="@{/admin/groups/dict/save}" class="toolbar">
        <input type="text" name="groupCode" placeholder="组编码，如 hx" required>
        <input type="text" name="groupName" placeholder="中文说明，如 华信业务线" style="width:180px;">
        <input type="text" name="techOwner" placeholder="技术负责人" style="width:90px;">
        <input type="text" name="bizOwner" placeholder="业务负责人" style="width:90px;">
        <input type="text" name="opsOwner" placeholder="运维负责人" style="width:90px;">
        <button type="submit">添加业务领域</button>
        <span class="muted">编码已存在则更新说明和负责人</span>
    </form>
    <table>
        <thead>
        <tr>
            <th>组编码</th>
            <th>中文说明</th>
            <th>技术负责人</th>
            <th>业务负责人</th>
            <th>运维负责人</th>
            <th>服务数</th>
            <th>更新时间</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(dicts)}">
            <td colspan="8" class="muted">暂无业务领域，先在上面添加（如 hx=华信业务线、xw=信维业务线）</td>
        </tr>
        <!-- groupCounts 由 GroupController 注入（countByGroup，key=__none__ 表示未分组不在此列） -->
        <tr th:each="d : ${dicts}">
            <td>
                <input type="text" name="groupCode" th:value="${d.groupCode}" readonly style="width:100px;">
            </td>
            <td>
                <input type="text" name="groupName" th:value="${d.groupName}" style="width:180px;"
                       th:attr="form=${'dictForm-' + d.id}">
            </td>
            <td>
                <input type="text" name="techOwner" th:value="${d.techOwner}" style="width:90px;"
                       th:attr="form=${'dictForm-' + d.id}">
            </td>
            <td>
                <input type="text" name="bizOwner" th:value="${d.bizOwner}" style="width:90px;"
                       th:attr="form=${'dictForm-' + d.id}">
            </td>
            <td>
                <input type="text" name="opsOwner" th:value="${d.opsOwner}" style="width:90px;"
                       th:attr="form=${'dictForm-' + d.id}">
            </td>
            <td>
                <!-- 组下的服务数，点击直达该组的微服务列表 -->
                <a th:href="@{/admin/services(bizGroup=${d.groupCode})}" style="color:#3742fa;"
                   th:text="${groupCounts[d.groupCode] != null} ? ${groupCounts[d.groupCode]} : 0">0</a>
            </td>
            <td class="muted" th:text="${d.updatedAt != null} ? ${#temporals.format(d.updatedAt, 'MM-dd HH:mm')} : '-'">09-15 10:00</td>
            <td>
                <button type="submit" th:attr="form=${'dictForm-' + d.id}">保存</button>
                <button type="submit" class="del" th:attr="form=${'dictForm-' + d.id}"
                        th:formaction="@{'/admin/groups/dict/delete/' + ${d.id}}">删除</button>
            </td>
        </tr>
        </tbody>
    </table>
    <!-- 每条字典对应的编辑 form（隐藏载体，控件通过 form 属性关联） -->
    <form th:each="d : ${dicts}" method="post" th:action="@{/admin/groups/dict/save}"
          th:id="${'dictForm-' + d.id}">
        <input type="hidden" name="groupCode" th:value="${d.groupCode}">
    </form>
</div>
</main>

</body>
</html>
