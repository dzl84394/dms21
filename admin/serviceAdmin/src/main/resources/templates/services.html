<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<!-- 公共 head（样式）+ 左侧导航，active=services 高亮 -->
<head th:replace="~{fragments/layout :: head('微服务管理', false)}"></head>
<body>
<div th:replace="~{fragments/layout :: sidebar('services')}"></div>

<main class="content">
<h1>微服务管理</h1>
<p class="desc">
    流程：Eureka 上的服务<b>自动同步入库</b>（标记"待确认"）→ 人工编辑<b>中文说明</b>、下拉选业务组、补三类负责人 →
    点<b>确认固定</b>，即成为固定微服务（之后同步永不覆盖）。左侧可按业务组直达；业务组不够用时去"业务组管理"页添加。
</p>

<!-- 搜索 + 过滤：GET 表单，条件改变后回车/点搜索即生效 -->
<form method="get" action="/admin/services" class="toolbar">
    <input type="text" name="q" th:value="${q}" placeholder="搜服务名 / 中文说明" style="width:200px;">
    <select name="bizGroup">
        <option value="">全部业务组</option>
        <!-- 选项来自业务组字典（显示编码·中文说明，提交编码）；__none__=未分组（search() 支持该哨兵值） -->
        <option value="__none__" th:selected="${bizGroup == '__none__'}">未分组</option>
        <option th:each="d : ${dicts}" th:value="${d.groupCode}"
                th:text="${d.groupCode + (d.groupName != null and !d.groupName.isEmpty() ? '·' + d.groupName : '')}"
                th:selected="${bizGroup == d.groupCode}">hx·华信业务线</option>
    </select>
    <select name="status">
        <option value="">全部状态</option>
        <option value="pending" th:selected="${status == 'pending'}">待确认</option>
        <option value="confirmed" th:selected="${status == 'confirmed'}">已固定</option>
    </select>
    <button type="submit">搜索</button>
    <a th:href="@{/admin/services}" th:if="${q != '' or bizGroup != '' or status != ''}"
       style="color:#3742fa;">清除条件</a>
</form>

<table>
    <thead>
    <tr>
        <th>服务名</th>
        <th>中文说明</th>
        <th>业务组</th>
        <th>系统</th>
        <th>技术负责人</th>
        <th>业务负责人</th>
        <th>运维负责人</th>
        <th>状态</th>
        <th>更新时间</th>
        <th>操作</th>
    </tr>
    </thead>
    <tbody>
    <!-- result 由 ServiceGroupService.search() 返回：items/total/page/totalPages -->
    <tr th:if="${#lists.isEmpty(result['items'])}">
        <td colspan="10" class="muted">没有匹配的记录（条件太严 / 服务还没注册上来）</td>
    </tr>
    <!-- 待确认的行浅黄底置顶（search 排序保证） -->
    <tr th:each="g : ${result['items']}" th:classappend="${g.isConfirmed()} ? '' : 'pending-row'">
        <td th:text="${g.serviceName}">service-a</td>
        <td>
            <input type="text" name="serviceNameCn" th:value="${g.serviceNameCn}"
                   placeholder="如：服务A-订单中心" style="width:180px;"
                   th:attr="form=${'editForm-' + g.id}">
        </td>
        <td>
            <!-- 业务组下拉：选项来自字典（显示编码·中文说明，提交编码）；库里值不在字典时仍显示原值 -->
            <select name="bizGroup" th:attr="form=${'editForm-' + g.id}">
                <option value="" th:selected="${g.bizGroup == null or g.bizGroup.isEmpty()}">未分组</option>
                <option th:each="d : ${dicts}" th:value="${d.groupCode}"
                        th:text="${d.groupCode + (d.groupName != null and !d.groupName.isEmpty() ? '·' + d.groupName : '')}"
                        th:selected="${g.bizGroup == d.groupCode}">hx·华信业务线</option>
                <!-- 兜底：库里存的组编码不在字典里（字典被删/改名）时才显示，保证原值可选 -->
                <option th:if="${g.bizGroup != null and !g.bizGroup.isEmpty()
                                and !dicts.![groupCode].contains(g.bizGroup)}"
                        th:value="${g.bizGroup}" th:text="${g.bizGroup} + '（不在字典）'"
                        th:selected="true">xw（不在字典）</option>
            </select>
        </td>
        <td>
            <input type="text" name="system" th:value="${g.system}"
                   th:attr="form=${'editForm-' + g.id}">
        </td>
        <td>
            <input type="text" name="techOwner" th:value="${g.techOwner}" placeholder="技术负责人"
                   style="width:80px;" th:attr="form=${'editForm-' + g.id}">
        </td>
        <td>
            <input type="text" name="bizOwner" th:value="${g.bizOwner}" placeholder="业务负责人"
                   style="width:80px;" th:attr="form=${'editForm-' + g.id}">
        </td>
        <td>
            <input type="text" name="opsOwner" th:value="${g.opsOwner}" placeholder="运维负责人"
                   style="width:80px;" th:attr="form=${'editForm-' + g.id}">
        </td>
        <td>
            <span class="badge" th:classappend="${g.isConfirmed()} ? 'ok' : 'warn'"
                  th:text="${g.isConfirmed()} ? '已固定' : '待确认'">待确认</span>
        </td>
        <td class="muted" th:text="${g.updatedAt != null} ? ${#temporals.format(g.updatedAt, 'MM-dd HH:mm')} : '-'">09-15 10:00</td>
        <td class="inline-form">
            <input type="hidden" name="id" th:value="${g.id}" th:attr="form=${'editForm-' + g.id}">
            <input type="hidden" name="serviceName" th:value="${g.serviceName}" th:attr="form=${'editForm-' + g.id}">
            <button type="submit" th:attr="form=${'editForm-' + g.id}">保存</button>
            <!-- 确认固定：保存当前编辑 + 标记为固定微服务（confirm=true 走查询参数） -->
            <button type="submit" th:attr="form=${'editForm-' + g.id}"
                    th:formaction="@{/admin/services/save(confirm=true)}"
                    th:disabled="${g.isConfirmed()}">确认固定</button>
            <button type="submit" class="del" th:attr="form=${'editForm-' + g.id}"
                    th:formaction="@{'/admin/services/delete/' + ${g.id}}">删除</button>
        </td>
    </tr>
    </tbody>
</table>

<!-- 每条记录对应的编辑 form（提交载体，表格里的控件用 form 属性关联） -->
<form th:each="g : ${result['items']}" method="post" th:action="@{/admin/services/save}"
      th:id="${'editForm-' + g.id}"></form>

<!-- 分页：保持 q/bizGroup/status 条件翻页 -->
<div class="pager" th:if="${result['total'] > 0}">
    <a th:if="${result['page'] > 1}"
       th:href="@{/admin/services(page=${result['page'] - 1}, q=${q}, bizGroup=${bizGroup}, status=${status})}">← 上一页</a>
    <span class="info">第 <b th:text="${result['page']}">1</b> / <b th:text="${result['totalPages']}">1</b> 页
        · 共 <b th:text="${result['total']}">0</b> 条（每页 20 条）</span>
    <a th:if="${result['page'] < result['totalPages']}"
       th:href="@{/admin/services(page=${result['page'] + 1}, q=${q}, bizGroup=${bizGroup}, status=${status})}">下一页 →</a>
</div>
</main>

</body>
</html>
