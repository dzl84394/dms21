<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<head th:replace="~{fragments/layout :: head('环境管理', false)}"></head>
<body>
<div th:replace="~{fragments/layout :: sidebar('env')}"></div>

<main class="content">
<h1>环境</h1>
<p class="desc">
    选中子系统后即可编辑其环境：一键初始化默认环境 DEV / STG / UAT / PROD，也可增删自定义环境；
    环境下仍有资源时不允许删除（先到"资源"页清空）。
</p>

<!-- 子系统选择器：公司 → 业务领域 → 子系统 级联过滤，选子系统即跳转（GET） -->
<form method="get" action="/admin/env" class="toolbar">
    <select id="companySel" style="font-size:13px;padding:5px 8px;">
        <option value="">全部公司</option>
        <option th:each="c : ${companies}" th:value="${c.id}"
                th:text="${(c.shortName != null and !c.shortName.isEmpty()) ? c.shortName : c.fullName}">某某科技</option>
    </select>
    <select id="domainSel" style="font-size:13px;padding:5px 8px;">
        <option value="">全部业务领域</option>
        <option th:each="d : ${bizDomains}" th:value="${d.id}" th:attr="data-company=${d.companyId}"
                th:text="${(d.shortName != null and !d.shortName.isEmpty()) ? d.shortName : d.fullName}">交易</option>
    </select>
    <select name="subsystemId" id="subsystemSel" onchange="this.form.submit()" style="font-size:13px;padding:5px 8px;">
        <option value="">请选择子系统</option>
        <option th:each="s : ${subsystems}" th:value="${s.id}"
                th:attr="data-company=${s.companyId},data-domain=${s.bizDomainId}"
                th:text="${s.code + ' / ' + ((s.shortName != null and !s.shortName.isEmpty()) ? s.shortName : s.fullName)}"
                th:selected="${subsystemId != null and subsystemId == s.id}">S001 / 交易</option>
    </select>
    <span class="muted" th:if="${subsystemId == null}">选中子系统后即可编辑环境</span>
</form>

<!-- 未选子系统：只给提示 -->
<div class="card" th:if="${subsystemId == null}">
    <p class="muted">请先在上方选择一个子系统（公司/业务领域可用于缩小子系统选项范围）。</p>
</div>

<!-- 已选子系统：环境清单 + 编辑操作 -->
<div th:if="${subsystemId != null}">

    <!-- 无环境：引导一键初始化 -->
    <div class="card" th:if="${#lists.isEmpty(envs)}" style="text-align:center;padding:32px;">
        <p style="margin:0 0 12px;">该子系统还没有环境，可一键初始化默认环境：</p>
        <form method="post" action="/admin/env/init-default" style="display:inline;">
            <input type="hidden" name="subsystemId" th:value="${subsystemId}">
            <button type="submit">初始化 DEV / STG / UAT / PROD</button>
        </form>
        <p class="muted" style="margin:12px 0 0;">也可以在下方直接添加自定义环境。</p>
    </div>

    <!-- 有环境：清单表格 -->
    <table th:if="${!#lists.isEmpty(envs)}">
        <thead>
        <tr>
            <th style="width:140px;">环境名</th>
            <th>资源数</th>
            <th>创建时间</th>
            <th style="width:120px;">操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="e : ${envs}">
            <td><b th:text="${e.name}">DEV</b></td>
            <td>
                <a th:href="@{/admin/resource(envId=${e.id})}" th:text="${resourceCounts[e.id]} + ' 台'" style="color:#3742fa;">0 台</a>
            </td>
            <td class="muted" th:text="${#temporals.format(e.createdAt, 'MM-dd HH:mm')}">10-17 12:00</td>
            <td class="inline-form">
                <form method="post" th:action="@{'/admin/env/delete/' + ${e.id}}" style="display:inline;">
                    <button type="submit" class="del">删除</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- 新增自定义环境（名称自动转大写，子系统内唯一） -->
    <div class="card" style="margin-top:16px;">
        <form method="post" action="/admin/env/save" class="toolbar" style="border:none;padding:0;margin:0;background:none;">
            <input type="hidden" name="subsystemId" th:value="${subsystemId}">
            <input type="text" name="name" required placeholder="自定义环境名，如 SIT" style="width:220px;">
            <button type="submit">+ 添加环境</button>
            <form method="post" action="/admin/env/init-default" style="display:inline;" th:if="${!#lists.isEmpty(envs)}">
                <input type="hidden" name="subsystemId" th:value="${subsystemId}">
                <button type="submit" style="background:#2ed573;">补齐默认环境</button>
            </form>
        </form>
    </div>
</div>
</main>

<!-- 级联过滤：公司 → 业务领域 → 子系统（子系统改变即提交 GET 跳转） -->
<script>
(function () {
    var companySel = document.getElementById('companySel');
    var domainSel = document.getElementById('domainSel');
    var subsystemSel = document.getElementById('subsystemSel');

    function filterOptions(sel, dataKey, parentValue) {
        var options = sel.options;
        for (var i = 0; i < options.length; i++) {
            var o = options[i];
            if (!o.value) { continue; }
            var show = (!parentValue || o.getAttribute(dataKey) === parentValue);
            o.hidden = !show;
            o.disabled = !show;
        }
        var sel0 = sel.selectedOptions[0];
        if (sel0 && sel0.hidden) { sel.value = ''; }
    }

    // 选中子系统后反向回填公司/领域，让级联状态与所选子系统一致
    function backfill() {
        var o = subsystemSel.selectedOptions[0];
        if (o && o.value) {
            companySel.value = o.getAttribute('data-company');
            domainSel.value = o.getAttribute('data-domain');
            filterOptions(domainSel, 'data-company', companySel.value);
            filterOptions(subsystemSel, 'data-domain', domainSel.value);
        }
    }

    companySel.addEventListener('change', function () {
        filterOptions(domainSel, 'data-company', companySel.value);
        filterOptions(subsystemSel, 'data-domain', domainSel.value);
    });
    domainSel.addEventListener('change', function () {
        filterOptions(subsystemSel, 'data-domain', domainSel.value);
    });
    backfill(); // 初始（带 subsystemId 进入时）回填公司/领域
})();
</script>

</body>
</html>
