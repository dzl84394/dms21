<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<head th:replace="~{fragments/layout :: head('业务领域表单', false)}"></head>
<body>
<div th:replace="~{fragments/layout :: sidebar('bizdomain')}"></div>

<main class="content">
<h1 th:text="${bizDomain != null} ? '编辑业务领域 #' + ${bizDomain.id} : '添加业务领域'">添加业务领域</h1>
<p class="desc">
    业务领域按公司租户隔离：先选所属公司，编号在公司内唯一。
</p>

<div class="card">
    <form method="post" action="/admin/bizdomain/save">
        <input type="hidden" name="id" th:if="${bizDomain != null}" th:value="${bizDomain.id}">

        <table style="max-width:560px;">
            <tbody>
            <tr>
                <td style="width:110px;">所属公司 <span style="color:#ff6b81;">*</span></td>
                <td>
                    <select name="companyId" required style="font-size:13px;padding:5px 8px;width:280px;">
                        <option value="" th:selected="${bizDomain == null}">请选择公司</option>
                        <option th:each="c : ${companies}" th:value="${c.id}"
                                th:text="${c.code + ' / ' + ((c.shortName != null and !c.shortName.isEmpty()) ? c.shortName : c.fullName)}"
                                th:selected="${bizDomain != null and bizDomain.companyId == c.id}">C001 / 某某科技</option>
                    </select>
                    <span class="muted" th:if="${#lists.isEmpty(companies)}">暂无公司，请先到"公司"页添加</span>
                </td>
            </tr>
            <tr>
                <td>编号 <span style="color:#ff6b81;">*</span></td>
                <td>
                    <input type="text" name="code" required
                           th:value="${bizDomain?.code}" placeholder="如 D001" style="width:180px;">
                    <span class="muted">公司内唯一</span>
                </td>
            </tr>
            <tr>
                <td>中文全称 <span style="color:#ff6b81;">*</span></td>
                <td>
                    <input type="text" name="fullName" required
                           th:value="${bizDomain?.fullName}" placeholder="如 交易业务域" style="width:100%;">
                </td>
            </tr>
            <tr>
                <td>简称</td>
                <td>
                    <input type="text" name="shortName"
                           th:value="${bizDomain?.shortName}" placeholder="如 交易" style="width:100%;">
                </td>
            </tr>
            <tr>
                <td>英文名称</td>
                <td>
                    <input type="text" name="englishName"
                           th:value="${bizDomain?.englishName}" placeholder="如 Trading Domain" style="width:100%;">
                </td>
            </tr>
            <tr>
                <td>介绍说明</td>
                <td>
                    <textarea name="description" rows="3" style="width:100%;"
                              th:text="${bizDomain?.description}" placeholder="业务范围/边界概述"></textarea>
                </td>
            </tr>
            </tbody>
        </table>

        <div style="margin-top:14px;">
            <button type="submit" th:text="${bizDomain != null} ? '保存修改' : '提交新增'">提交新增</button>
            <a th:href="@{/admin/bizdomain}" style="margin-left:12px;color:#3742fa;">取消返回</a>
        </div>
    </form>
</div>
</main>

</body>
</html>
