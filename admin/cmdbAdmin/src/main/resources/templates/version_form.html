<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<head th:replace="~{fragments/layout :: head('版本表单', false)}"></head>
<body>
<div th:replace="~{fragments/layout :: sidebar('version')}"></div>

<main class="content">
<h1 th:text="${version != null} ? '编辑版本 #' + ${version.id} : '添加版本'">添加版本</h1>
<p class="desc">
    版本挂在「公司 → 业务领域 → 子系统」下：逐级选择会自动过滤下一级选项；
    选定子系统后所属公司与业务领域自动回填（保存时以子系统自身归属为准）。版本编号在子系统内唯一。
</p>

<div class="card">
    <form method="post" action="/admin/version/save">
        <input type="hidden" name="id" th:if="${version != null}" th:value="${version.id}">

        <table style="max-width:600px;">
            <tbody>
            <tr>
                <td style="width:130px;">所属公司 <span style="color:#ff6b81;">*</span></td>
                <td>
                    <select id="companySel" style="font-size:13px;padding:5px 8px;width:280px;">
                        <option value="" th:selected="${version == null}">请选择公司</option>
                        <option th:each="c : ${companies}" th:value="${c.id}"
                                th:text="${c.code + ' / ' + ((c.shortName != null and !c.shortName.isEmpty()) ? c.shortName : c.fullName)}"
                                th:selected="${version != null and version.companyId == c.id}">C001 / 某某科技</option>
                    </select>
                    <span class="muted">选子系统后自动回填，仅用于过滤</span>
                </td>
            </tr>
            <tr>
                <td>所属业务领域 <span style="color:#ff6b81;">*</span></td>
                <td>
                    <select id="domainSel" style="font-size:13px;padding:5px 8px;width:280px;">
                        <option value="" th:selected="${version == null}">请选择业务领域</option>
                        <option th:each="d : ${bizDomains}" th:value="${d.id}" th:attr="data-company=${d.companyId}"
                                th:text="${d.code + ' / ' + ((d.shortName != null and !d.shortName.isEmpty()) ? d.shortName : d.fullName)}"
                                th:selected="${version != null and version.bizDomainId == d.id}">D001 / 交易</option>
                    </select>
                    <span class="muted">随公司联动</span>
                </td>
            </tr>
            <tr>
                <td>所属子系统 <span style="color:#ff6b81;">*</span></td>
                <td>
                    <select name="subsystemId" id="subsystemSel" required style="font-size:13px;padding:5px 8px;width:280px;">
                        <option value="" th:selected="${version == null}">请选择子系统</option>
                        <option th:each="s : ${subsystems}" th:value="${s.id}"
                                th:attr="data-company=${s.companyId},data-domain=${s.bizDomainId}"
                                th:text="${s.code + ' / ' + ((s.shortName != null and !s.shortName.isEmpty()) ? s.shortName : s.fullName)}"
                                th:selected="${(version != null and version.subsystemId == s.id) or (version == null and subsystemId != null and subsystemId == s.id)}">S001 / 交易</option>
                    </select>
                    <span class="muted" th:if="${#lists.isEmpty(subsystems)}">暂无子系统，请先到"子系统"页添加</span>
                </td>
            </tr>
            <tr>
                <td>版本编号 <span style="color:#ff6b81;">*</span></td>
                <td>
                    <input type="text" name="code" required
                           th:value="${version?.code}" placeholder="如 V1.0.0 或 2026.10.18" style="width:100%;">
                    <span class="muted">子系统内唯一</span>
                </td>
            </tr>
            <tr>
                <td>git代码库版本 <span style="color:#ff6b81;">*</span></td>
                <td>
                    <input type="text" name="gitVersion" required
                           th:value="${version?.gitVersion}" placeholder="commit / tag / 分支，如 a1b2c3d 或 release-1.0.0" style="width:100%;">
                </td>
            </tr>
            <tr>
                <td>版本说明</td>
                <td>
                    <input type="text" name="description"
                           th:value="${version?.description}" placeholder="发布内容/变更摘要" style="width:100%;">
                </td>
            </tr>
            </tbody>
        </table>

        <div style="margin-top:14px;">
            <button type="submit" th:text="${version != null} ? '保存修改' : '提交新增'">提交新增</button>
            <a th:href="@{/admin/version}" style="margin-left:12px;color:#3742fa;">取消返回</a>
        </div>
    </form>
</div>
</main>

<!-- 三级级联：公司 → 业务领域 → 子系统 逐级过滤；选子系统反向回填公司/领域 -->
<script>
(function () {
    var companySel = document.getElementById('companySel');
    var domainSel = document.getElementById('domainSel');
    var subsystemSel = document.getElementById('subsystemSel');

    function filterOptions(sel, dataKey, parentValue) {
        var options = sel.options;
        for (var i = 0; i < options.length; i++) {
            var o = options[i];
            if (!o.value) { continue; }
            var show = (!parentValue || o.getAttribute(dataKey) === parentValue);
            o.hidden = !show;
            o.disabled = !show;
        }
        var sel0 = sel.selectedOptions[0];
        if (sel0 && sel0.hidden) { sel.value = ''; }
    }

    function refresh() {
        filterOptions(domainSel, 'data-company', companySel.value);
        filterOptions(subsystemSel, 'data-domain', domainSel.value);
    }

    function backfill() {
        var o = subsystemSel.selectedOptions[0];
        if (o && o.value) {
            companySel.value = o.getAttribute('data-company');
            domainSel.value = o.getAttribute('data-domain');
        }
        refresh();
    }

    companySel.addEventListener('change', refresh);
    domainSel.addEventListener('change', refresh);
    subsystemSel.addEventListener('change', backfill);
    refresh(); // 编辑/预选模式初始按已选公司/领域过滤一遍
})();
</script>

</body>
</html>
