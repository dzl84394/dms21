<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<head th:replace="~{fragments/layout :: head('业务领域管理', false)}"></head>
<body>
<div th:replace="~{fragments/layout :: sidebar('bizdomain')}"></div>

<main class="content">
<h1>业务领域</h1>
<p class="desc">
    公司下的业务板块划分，按公司租户隔离（所属公司列 + 公司过滤）。支持按关键词（编号/全称/简称/英文名）过滤。
    <a th:href="@{/admin/bizdomain/form}" style="color:#3742fa;">+ 添加业务领域</a>
</p>

<!-- 过滤：GET 表单，按公司下拉 + 关键词，条件改变后回车/点搜索即生效 -->
<form method="get" action="/admin/bizdomain" class="toolbar">
    <select name="companyId" style="font-size:13px;padding:5px 8px;">
        <option value="">全部公司</option>
        <option th:each="c : ${companies}" th:value="${c.id}" th:text="${c.shortName != null and !c.shortName.isEmpty()} ? ${c.shortName} : ${c.fullName}"
                th:selected="${companyId != null and companyId == c.id}">某某科技</option>
    </select>
    <input type="text" name="keyword" th:value="${keyword}" placeholder="编号/全称/简称/英文名" style="width:220px;">
    <button type="submit">搜索</button>
    <a th:href="@{/admin/bizdomain}" th:if="${companyId != null or keyword != ''}" style="color:#3742fa;">清除条件</a>
</form>

<table>
    <thead>
    <tr>
        <th>编号</th>
        <th>所属公司</th>
        <th>中文全称</th>
        <th>简称</th>
        <th>英文名称</th>
        <th>介绍说明</th>
        <th>更新时间</th>
        <th>操作</th>
    </tr>
    </thead>
    <tbody>
    <tr th:if="${#lists.isEmpty(items)}">
        <td colspan="8" class="muted">暂无业务领域，点上方"添加业务领域"录入第一条（需先有公司）。</td>
    </tr>
    <tr th:each="e : ${items}">
        <td><b th:text="${e.code}">D001</b></td>
        <td th:text="${companyNames[e.companyId]}">某某科技</td>
        <td th:text="${e.fullName}">交易业务域</td>
        <td th:text="${e.shortName != null and !e.shortName.isEmpty()} ? ${e.shortName} : '-'">交易</td>
        <td th:text="${e.englishName != null and !e.englishName.isEmpty()} ? ${e.englishName} : '-'">-</td>
        <td class="muted" th:text="${e.description != null and !e.description.isEmpty()} ? ${e.description} : '-'">-</td>
        <td class="muted" th:text="${#temporals.format(e.updatedAt, 'MM-dd HH:mm')}">10-17 12:00</td>
        <td class="inline-form">
            <a th:href="@{/admin/bizdomain/form(id=${e.id})}" style="color:#3742fa;">编辑</a>
            <form method="post" th:action="@{'/admin/bizdomain/delete/' + ${e.id}}" style="display:inline;">
                <button type="submit" class="del">删除</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</main>

</body>
</html>
